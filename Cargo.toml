[workspace]
resolver = "3"
members = ["crates/rotj-rom", "crates/rotj-core", "crates/rotj-apu", "crates/rotj-music", "tools/rotj-tools", "tools/rotj-verify", "tools/rotj-oracle", "crates/app"]

[workspace.package]
version = "1.1.2"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/minz1/bevy-rotj"

[workspace.dependencies]
bevy = { version = "0.20" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
image = "0.25"
heck = "0.5"
ron = "0.12"
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny" # user requirement: NO unsafe code, ever
future_incompatible = { level = "warn", priority = -1 }
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# sensible pedantic relaxations
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
