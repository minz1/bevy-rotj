name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: tests + deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps for bevy
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: batman-rotj-${{ github.sha }}
          path: target/release/batman-rotj

  boot:
    name: boot smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install runtime deps (window + software renderer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libgl1-mesa-dri mesa-vulkan-drivers vulkan-tools
      # Public CI has no ROM: tools/boot-check.sh then checks that the app exits 2 with its
      # "ROM not found" message instead of panicking. With a ROM (raw/ or ROTJ_ROM) it also
      # boots the game and requires it to keep running.
      - name: boot check
        run: xvfb-run -a bash tools/boot-check.sh 60
